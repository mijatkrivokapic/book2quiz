spring.application.name=book2quiz

minio.internal-url=${MINIO_INTERNAL_URL}
minio.external-url=${MINIO_EXTERNAL_URL}
minio.access.key=${MINIO_ACCESS_KEY}
minio.secret.key=${MINIO_SECRET_KEY}

spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB

markdown-worker.base-url=${MARKDOWN_WORKER_URL:http://markdown-worker:8000}
markdown-worker.connect-timeout=10s
markdown-worker.read-timeout=10m
markdown-worker.retries=2
markdown-worker.retry-backoff=5s

chapter-detection.font-size-ratio=1.3
chapter-detection.patterns[0]=^chapter\\s+\\d+.*
chapter-detection.patterns[1]=^poglavlje\\s+\\d+.*
chapter-detection.patterns[2]=^\\d+\\.\\s+\\S.*

#TODO add to docker env

# Quiz generation (Claude API). The API key comes ONLY from the ANTHROPIC_API_KEY env var.
quiz.prompt-version=v1
quiz.max-material-chars=100000
quiz.anthropic.model=claude-sonnet-5
# Output cap (includes adaptive-thinking tokens on Sonnet 5). It is a ceiling, not a target —
# the model normally stops on its own (~14k for 5 questions); this headroom prevents the JSON
# being truncated mid-string when a generation needs a bit more.
quiz.anthropic.max-tokens=32000
# quiz.anthropic.temperature is intentionally unset: the Opus/Sonnet 5 family rejects it.
# Set it only for older models that still accept sampling, e.g. quiz.anthropic.temperature=0.7
quiz.anthropic.timeout=10m
quiz.anthropic.max-retries=2
quiz.anthropic.structured-outputs.enabled=true
# Optional anthropic-beta header for structured outputs; leave blank unless the API requires it.
quiz.anthropic.structured-outputs.beta-header=
# Prompt caching (cache_control: ephemeral) of the reused prompt prefix. ttl: 5m or 1h.
quiz.anthropic.cache.enabled=true
quiz.anthropic.cache.ttl=1h
# Prompt files (use file:... to override without rebuilding).
quiz.prompt.system-file=classpath:prompts/quiz-system.txt
quiz.prompt.schema-file=classpath:prompts/quiz-schema.json
quiz.prompt.regenerate-system-file=classpath:prompts/quiz-regenerate-system.txt
quiz.prompt.regenerate-schema-file=classpath:prompts/quiz-regenerate-schema.json